<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar sintético</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--pn:#111a26;--bd:#263648;--tx:#e5edf5;--mu:#8fa2b8;--ac:#58b8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px Inter,"Segoe UI",Arial,sans-serif;overflow:hidden}
#bar{position:absolute;top:0;left:0;right:0;z-index:2;background:var(--pn);border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#bar .t{margin-right:12px;line-height:1.25}#bar .t b{font-size:15px}#bar .t div{color:var(--mu);font-size:12px}
button,select{background:#172332;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font:inherit;min-height:34px;cursor:pointer}
button.on{background:#174a70;border-color:#327db2}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.ov{position:absolute;z-index:1;pointer-events:none;text-shadow:0 0 4px #000,0 0 2px #000}
#il{left:12px;bottom:34px}#il b{color:var(--ac);font-size:15px}#ir{right:12px;bottom:34px;text-align:right}
#cb{position:absolute;left:0;bottom:0;width:100%;height:24px;z-index:1}
#rd{position:absolute;z-index:2;right:12px;top:96px;background:#000b;border:1px solid var(--bd);padding:4px 8px;border-radius:6px;pointer-events:none}
label{color:var(--mu);display:flex;align-items:center;gap:6px}

#cat{border-color:#3979a4}
#catalog{position:absolute;z-index:5;right:12px;top:82px;bottom:34px;width:min(390px,calc(100vw - 24px));background:#101a27f5;border:1px solid var(--bd);border-radius:9px;padding:12px;display:none;overflow:auto;box-shadow:0 10px 35px #0009}
#catalog.open{display:block}
#catalog h2{font-size:16px;margin:0 0 8px}
#catalog p{color:var(--mu);line-height:1.4;margin:5px 0 10px}
#catalog input{width:100%;background:#0b131e;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:9px;margin-bottom:9px;font:inherit}
#catalog-list{display:grid;gap:5px}
.tech{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;width:100%;min-height:38px}
.tech small{color:var(--mu);text-align:right}
.tech b{color:#dceaf7}
.tech-group{color:var(--ac);font-weight:600;margin:12px 0 3px}
#catalog-detail{border-top:1px solid var(--bd);margin-top:10px;padding-top:9px;color:var(--mu);line-height:1.45}#catalog-detail h3{color:var(--tx);margin:0 0 5px;font-size:15px}#catalog-detail dl{display:grid;grid-template-columns:90px 1fr;gap:5px;margin:10px 0}#catalog-detail dt{color:var(--mu)}#catalog-detail dd{margin:0;color:var(--tx)}.tech.selected{border-color:var(--ac);background:#17344b}
</style></head><body>
<div id="bar"><div class="t"><b>KSBX Sandbox</b><div>VCP 212: modo precipitação</div></div>
<span id="pb"></span><select id="tl" aria-label="Elevação"></select>
<select id="sc" aria-label="Cenário"><option value="line">Linha de instabilidade</option><option value="super">Supercélula</option><option value="strat">Chuva estratiforme</option></select>
<button id="pl" aria-label="Pausar ou tocar">⏸</button><button id="cat" type="button">Catálogo</button>
<label><input type="checkbox" id="da"> Desdobrar velocidade</label></div>
<aside id="catalog" aria-label="Catálogo de tecnologias de radar"><h2>Catálogo de tecnologias</h2><p>Biblioteca educativa. “Planejado” indica que a tecnologia ainda não possui um modelo próprio no simulador.</p><input id="tech-search" type="search" placeholder="Buscar sigla ou nome..." aria-label="Buscar tecnologia"><div id="catalog-count" aria-live="polite"></div><div id="catalog-list"></div><div id="catalog-detail">Selecione uma tecnologia para ver seus dados.</div></aside><canvas id="c"></canvas><canvas id="cb"></canvas>
<div class="ov" id="il"></div><div class="ov" id="ir"></div><div id="rd" hidden></div>
<script>
(()=>{'use strict';
const RM=230,NAZ=720,NG=460,GT=RM/NG,D=Math.PI/180,RE=8495,VN=26;
const $=i=>document.getElementById(i),cv=$('c'),cx=cv.getContext('2d'),cb=$('cb'),bx=cb.getContext('2d');
let scen='line',prod='BR',tilt=0.5,t=0,play=true,dea=false,cur=null,drag=null;
const view={x:0,y:0,s:Math.min(innerWidth,innerHeight)/280};

/* ---------- catálogo educativo de tecnologias ---------- */
const TECH=[
['CW','Ondas e formas de onda','Continuous-Wave Radar','Disponível (educativo)'],['FMCW','Ondas e formas de onda','Frequency-Modulated Continuous-Wave Radar','Disponível (educativo)'],['SFCW','Ondas e formas de onda','Stepped-Frequency Continuous-Wave Radar','Disponível (modelo SFCW)'],['UWB','Ondas e formas de onda','Ultra-Wideband Radar','Disponível (modelo de pulso)'],
['PD','Processamento e modos','Pulse-Doppler'],['LPI','Processamento e modos','Low Probability of Intercept'],['MTI','Processamento e modos','Moving Target Indication'],['AMTI','Processamento e modos','Airborne Moving Target Indication'],['GMTI','Processamento e modos','Ground Moving Target Indication'],['ARPA','Processamento e modos','Automatic Radar Plotting Aid'],
['PESA','Antenas e arquiteturas','Passive Electronically Scanned Array'],['AESA','Antenas e arquiteturas','Active Electronically Scanned Array'],['MIMO','Antenas e arquiteturas','Multiple-Input Multiple-Output'],
['PCL','Passivos e além do horizonte','Passive Coherent Location'],['OTH','Passivos e além do horizonte','Over-the-Horizon Radar'],['OTHR','Passivos e além do horizonte','Over-the-Horizon Radar'],['ROTHR','Passivos e além do horizonte','Relocatable Over-the-Horizon Radar'],['SWR','Passivos e além do horizonte','Sigla dependente do contexto'],['HFSWR','Passivos e além do horizonte','High-Frequency Surface-Wave Radar'],
['SLAR','Imageamento e sensoriamento','Side-Looking Airborne Radar'],['SAR','Imageamento e sensoriamento','Synthetic Aperture Radar'],['InSAR','Imageamento e sensoriamento','Interferometric SAR'],['DInSAR','Imageamento e sensoriamento','Differential Interferometric SAR'],['PSInSAR','Imageamento e sensoriamento','Persistent Scatterer Interferometry'],['PolSAR','Imageamento e sensoriamento','Polarimetric SAR'],['PolInSAR','Imageamento e sensoriamento','Polarimetric Interferometric SAR'],['ISAR','Imageamento e sensoriamento','Inverse Synthetic Aperture Radar'],
['GPR','Subsuperfície e medição','Ground-Penetrating Radar'],['TWR','Subsuperfície e medição','Through-Wall Radar'],['LPR','Subsuperfície e medição','License-Plate Recognition Radar (uso da sigla varia)'],
['WSR','Meteorológicos','Weather Surveillance Radar'],['Dual-Pol','Meteorológicos','Dual-Polarization Weather Radar'],['DOW','Meteorológicos','Doppler on Wheels'],['PAR','Meteorológicos','Phased-Array Radar'],['TDWR','Meteorológicos','Terminal Doppler Weather Radar'],['WPR','Meteorológicos','Wind Profiler Radar'],['RASS','Meteorológicos','Radio Acoustic Sounding System'],['MMCR','Meteorológicos','Millimeter-Wave Cloud Radar'],
['PSR','Aeronáuticos','Primary Surveillance Radar'],['SSR','Aeronáuticos','Secondary Surveillance Radar'],['MSSR','Aeronáuticos','Monopulse Secondary Surveillance Radar'],['ASR','Aeronáuticos','Airport Surveillance Radar'],['ARSR','Aeronáuticos','Air Route Surveillance Radar'],['SMR','Aeronáuticos','Surface Movement Radar'],['ASDE','Aeronáuticos','Airport Surface Detection Equipment'],['RALT','Altimetria e navegação','Radar Altimeter'],['RADALT','Altimetria e navegação','Radar Altimeter'],['WXR','Meteorológicos','Weather Radar (aeronáutico)'],
['EWR','Vigilância e defesa (visão geral)','Early Warning Radar'],['BMEWS','Vigilância e defesa (visão geral)','Ballistic Missile Early Warning System'],['FCR','Vigilância e defesa (visão geral)','Fire-Control Radar'],['TAR','Vigilância e defesa (visão geral)','Target Acquisition Radar'],['TTR','Vigilância e defesa (visão geral)','Target Tracking Radar'],['GCI','Vigilância e defesa (visão geral)','Ground-Controlled Interception'],['C-RAM','Vigilância e defesa (visão geral)','Counter-Rocket, Artillery and Mortar radar'],['GSR','Vigilância e defesa (visão geral)','Ground Surveillance Radar'],
['SRR','Classes por alcance','Short-Range Radar'],['MRR','Classes por alcance','Medium-Range Radar'],['LRR','Classes por alcance','Long-Range Radar'],['4D Imaging Radar','Imageamento e sensoriamento','Radar de imageamento 4D']
].map(([id,category,name])=>({id,category,name,status:id==='CW'||id==='FMCW'?'Disponível (educativo)':id==='SFCW'?'Disponível (modelo SFCW)':id==='UWB'?'Disponível (modelo de pulso)':id==='PD'?'Disponível (modelo Doppler sintético)':id==='LPI'?'Disponível (visualização conceitual)':id==='MTI'?'Disponível (modelo de filtro)':id==='WSR'?'Disponível (sintético)':id==='Dual-Pol'?'Parcial':'Planejado'}));
let selectedTech=null;
function showTech(item){
 selectedTech=item;
 const detail=$('catalog-detail');
 detail.innerHTML='<h3></h3><div></div><dl><dt>Categoria</dt><dd data-field="category"></dd><dt>Estado</dt><dd data-field="status"></dd><dt>Fidelidade</dt><dd data-field="level"></dd><dt>Escopo</dt><dd data-field="scope"></dd></dl><button id="tech-activate" type="button" hidden>Ativar demonstração</button><p id="tech-active-note" aria-live="polite"></p><section id="cw-panel" hidden style="border-top:1px solid var(--bd);margin-top:10px;padding-top:10px"><h3>Demonstração CW — efeito Doppler</h3><p>O gráfico representa uma onda recebida. A mudança de frequência depende da velocidade radial relativa; o sinal não fornece distância neste modelo CW simples.</p><label for="cw-velocity">Velocidade radial simulada: <output id="cw-velocity-value">+10</output> m/s</label><input id="cw-velocity" type="range" min="-30" max="30" step="1" value="10" style="width:100%"><div id="cw-frequency" style="font-size:13px;color:var(--ac);margin:8px 0">Deslocamento Doppler ilustrativo: +667 Hz</div><svg id="cw-wave" viewBox="0 0 320 90" role="img" aria-label="Representação ilustrativa da onda recebida" style="width:100%;background:#09111b;border-radius:6px"><path d="M0 45H320" stroke="#52677c" stroke-dasharray="4 4"/><path id="cw-wave-path" fill="none" stroke="#58b8ff" stroke-width="2"/></svg><p style="font-size:12px;color:var(--mu)">Modelo didático simplificado: frequência de referência ilustrativa de 10 GHz. Não representa um equipamento real nem mede alcance.</p></section><section id="fmcw-panel" hidden style="border-top:1px solid var(--bd);margin-top:10px;padding-top:10px"><h3>Demonstração FMCW — chirp e batimento</h3><p>Um chirp linear varia a frequência ao longo do tempo. A diferença entre o sinal transmitido e o eco recebido produz uma frequência de batimento, relacionada à distância.</p><label for="fmcw-range">Distância simulada: <output id="fmcw-range-value">100 m</output></label><input id="fmcw-range" type="range" min="10" max="300" step="5" value="100" style="width:100%"><label for="fmcw-velocity">Velocidade radial simulada: <output id="fmcw-velocity-value">+5.0 m/s</output></label><input id="fmcw-velocity" type="range" min="-30" max="30" step="0.5" value="5" style="width:100%"><div style="background:#09111b;border-radius:6px;padding:10px;margin-top:8px"><div>Batimento ilustrativo: <b id="fmcw-beat" style="color:var(--ac)">—</b></div><div>Componente Doppler: <b id="fmcw-doppler">—</b></div><div>Resolução em distância teórica: <b id="fmcw-resolution">—</b></div></div><p style="font-size:12px;color:var(--mu)">Parâmetros didáticos assumidos: portadora de 77 GHz, largura de banda de 200 MHz e chirp de 1 ms. A conta de batimento é simplificada e não substitui processamento de sinais I/Q nem calibração de sensor real.</p></section><section id="sfcw-panel" hidden style="border-top:1px solid var(--bd);margin-top:10px;padding-top:10px"><h3>SFCW — resposta coerente e perfil de distância</h3><p>O modelo sintetiza ecos complexos em frequências discretas igualmente espaçadas. A IFFT converte a sequência de frequência em um perfil de distância; os picos correspondem aos refletores simulados.</p><label for="sfcw-bandwidth">Largura de banda: <output id="sfcw-bandwidth-value">400 MHz</output></label><input id="sfcw-bandwidth" type="range" min="100" max="1000" step="25" value="400" style="width:100%"><label for="sfcw-noise">Ruído de fase/amplitude: <output id="sfcw-noise-value">2%</output></label><input id="sfcw-noise" type="range" min="0" max="15" step="1" value="2" style="width:100%"><div style="background:#09111b;border-radius:6px;padding:9px;margin-top:8px"><div>Resolução teórica: <b id="sfcw-resolution" style="color:var(--ac)">—</b></div><div>Alcance não ambíguo: <b id="sfcw-unambiguous">—</b></div><div>Amostras coerentes: <b>128 frequências</b></div></div><svg id="sfcw-profile" viewBox="0 0 320 150" role="img" aria-label="Perfil de distância reconstruído por IFFT" style="width:100%;background:#09111b;border-radius:6px;margin-top:8px"><path d="M28 10V122H310" stroke="#52677c" fill="none"/><path id="sfcw-profile-path" d="" stroke="#58b8ff" stroke-width="1.8" fill="none"/><text x="30" y="140" fill="#8fa2b8" font-size="9">0 m</text><text id="sfcw-max-label" x="306" y="140" fill="#8fa2b8" font-size="9" text-anchor="end">—</text><text x="7" y="15" fill="#8fa2b8" font-size="9">Eco</text></svg><p style="font-size:12px;color:var(--mu)">Modelo coerente de banda-base: 128 passos uniformes, portadora de referência de 5,8 GHz, três refletores sintéticos e IFFT direta. Não inclui antena, canal multipercurso completo, calibração nem hardware real.</p></section><section id="uwb-panel" hidden style="border-top:1px solid var(--bd);margin-top:10px;padding-top:10px"><h3>UWB — pulsos ultracurtos e ecos sintéticos</h3><p>O UWB usa sinais de banda muito larga. Esta bancada gera um pulso monociclo gaussiano e soma ecos sintéticos atrasados para mostrar como a largura de banda afeta a resolução temporal e a separação entre ecos.</p><label for="uwb-bandwidth">Largura de banda ilustrativa: <output id="uwb-bandwidth-value">1.0 GHz</output></label><input id="uwb-bandwidth" type="range" min="500" max="2000" step="100" value="1000" style="width:100%"><label for="uwb-noise">Ruído sintético: <output id="uwb-noise-value">3%</output></label><input id="uwb-noise" type="range" min="0" max="15" step="1" value="3" style="width:100%"><div style="background:#09111b;border-radius:6px;padding:9px;margin-top:8px"><div>Resolução temporal aproximada: <b id="uwb-time-resolution" style="color:var(--ac)">—</b></div><div>Resolução espacial teórica: <b id="uwb-range-resolution">—</b></div><div>Janela exibida: <b>0–100 ns</b></div></div><svg id="uwb-wave" viewBox="0 0 320 150" role="img" aria-label="Pulso UWB e ecos sintéticos no domínio do tempo" style="width:100%;background:#09111b;border-radius:6px;margin-top:8px"><path d="M28 10V122H310" stroke="#52677c" fill="none"/><path id="uwb-wave-path" d="" stroke="#58b8ff" stroke-width="1.8" fill="none"/><text x="30" y="140" fill="#8fa2b8" font-size="9">0 ns</text><text x="306" y="140" fill="#8fa2b8" font-size="9" text-anchor="end">100 ns</text><text x="7" y="15" fill="#8fa2b8" font-size="9">Amplitude</text></svg><p style="font-size:12px;color:var(--mu)">Modelo temporal de laboratório com um pulso transmitido e três ecos artificiais. Não representa um dispositivo certificado, canal real, antena ou aplicação de localização.</p></section><section id="pd-panel" hidden style="border-top:1px solid var(--bd);margin-top:10px;padding-top:10px"><h3>PD — sequência de pulsos e espectro Doppler sintético</h3><p>Modelo de laboratório: uma sequência abstrata de ecos complexos é amostrada em pulsos sucessivos. A variação de fase entre pulsos produz um pico no espectro Doppler. Os dados são inteiramente sintéticos e não representam detecção ou acompanhamento de objetos reais.</p><label for="pd-frequency">Frequência Doppler normalizada: <output id="pd-frequency-value">0,18</output></label><input id="pd-frequency" type="range" min="-45" max="45" step="1" value="18" style="width:100%"><label for="pd-noise">Ruído sintético: <output id="pd-noise-value">5%</output></label><input id="pd-noise" type="range" min="0" max="20" step="1" value="5" style="width:100%"><div style="background:#09111b;border-radius:6px;padding:9px;margin-top:8px"><div>Frequência normalizada: <b id="pd-frequency-readout" style="color:var(--ac)">0,18</b></div><div>Pico espectral estimado: <b id="pd-peak">—</b></div><div>Amostras coerentes: <b>64 pulsos sintéticos</b></div></div><svg id="pd-spectrum" viewBox="0 0 320 150" role="img" aria-label="Espectro Doppler sintético de uma sequência de pulsos" style="width:100%;background:#09111b;border-radius:6px"><path d="M20 120H300M160 16V126" stroke="#52677c" stroke-width="1"/><path id="pd-spectrum-path" d="" stroke="#58b8ff" stroke-width="1.8" fill="none"/><text x="20" y="140" fill="#8fa2b8" font-size="9">−0,5</text><text x="300" y="140" fill="#8fa2b8" font-size="9" text-anchor="end">+0,5</text><text x="7" y="12" fill="#8fa2b8" font-size="9">Potência</text></svg><p style="font-size:12px;color:var(--mu)">Demonstração de processamento coerente em tempo lento e análise espectral simplificada; não inclui canal físico completo, ambiguidades de alcance/velocidade, clutter real ou hardware.</p></section><section id="lpi-panel" hidden style="border-top:1px solid var(--bd);margin-top:10px;padding-top:10px"><h3>LPI — conceito de emissão e distribuição espectral</h3><p>Esta visualização é conceitual: compara uma emissão concentrada em uma faixa estreita com energia distribuída por uma faixa mais ampla. Ela serve apenas para explicar a ideia geral de distribuição de energia no espectro.</p><div style="background:#09111b;border-radius:6px;padding:9px;margin-top:8px"><b>Representação esquemática — não está em escala</b><svg viewBox="0 0 320 170" role="img" aria-label="Comparação conceitual de energia espectral concentrada e distribuída" style="width:100%;margin-top:6px"><path d="M24 136H300M24 18V136" stroke="#52677c" fill="none"/><path d="M24 136 C115 136 137 134 151 24 C165 134 187 136 300 136" stroke="#ffb454" stroke-width="2" fill="none"/><path d="M24 136 C55 136 66 124 83 105 S112 66 139 60 S181 66 207 91 S251 133 300 136" stroke="#58b8ff" stroke-width="2" fill="none"/><text x="28" y="14" fill="#8fa2b8" font-size="9">Energia relativa</text><text x="160" y="158" fill="#8fa2b8" font-size="9" text-anchor="middle">Frequência (esquema)</text><text x="224" y="32" fill="#ffb454" font-size="9">Concentrada</text><text x="224" y="48" fill="#58b8ff" font-size="9">Distribuída</text></svg></div><p style="font-size:12px;color:var(--mu)">Não calcula probabilidade de interceptação, alcance de detecção nem parâmetros de emissão. Não representa um projeto LPI operacional, receptor ou cenário real.</p></section><section id="mti-panel" hidden style="border-top:1px solid var(--bd);margin-top:10px;padding-top:10px"><h3>MTI — cancelamento de componente estacionária</h3><p>Experimento matemático com uma sequência sintética: uma componente constante representa fundo estacionário e uma pequena componente variável representa mudança entre amostras. O filtro de diferença entre amostras consecutivas reduz a componente constante.</p><label for="mti-change">Variação da componente sintética: <output id="mti-change-value">0,20</output></label><input id="mti-change" type="range" min="2" max="45" step="1" value="20" style="width:100%"><label for="mti-background">Nível do fundo constante: <output id="mti-background-value">0,70</output></label><input id="mti-background" type="range" min="10" max="90" step="5" value="70" style="width:100%"><div style="background:#09111b;border-radius:6px;padding:9px;margin-top:8px"><div>Componente constante após filtragem: <b id="mti-residual">0</b></div><div>Amplitude variável após filtragem: <b id="mti-output">—</b></div></div><svg id="mti-chart" viewBox="0 0 320 170" role="img" aria-label="Comparação entre sequência sintética original e saída do filtro de diferença" style="width:100%;background:#09111b;border-radius:6px"><path d="M20 82H300M20 18V148" stroke="#52677c" fill="none"/><path id="mti-input-path" d="" stroke="#ffb454" stroke-width="1.5" fill="none"/><path id="mti-output-path" d="" stroke="#58b8ff" stroke-width="1.8" fill="none"/><text x="24" y="14" fill="#ffb454" font-size="9">Entrada</text><text x="78" y="14" fill="#58b8ff" font-size="9">Diferença</text><text x="160" y="164" fill="#8fa2b8" font-size="9" text-anchor="middle">Índice da amostra</text></svg><p style="font-size:12px;color:var(--mu)">Modelo didático de um filtro de duas amostras. Não simula clutter ambiental real, geometria, detecção, rastreamento ou parâmetros de um sistema operacional.</p></section>'
 detail.querySelector('h3').textContent=item.id+' — '+item.name;
 detail.querySelector('div').textContent='Ficha técnica educativa do catálogo.';
 detail.querySelector('[data-field="category"]').textContent=item.category;
 detail.querySelector('[data-field="status"]').textContent=item.status;
 detail.querySelector('[data-field="level"]').textContent=item.id==='CW'?'Demonstração conceitual do efeito Doppler':item.id==='FMCW'?'Demonstração educativa de chirp, distância por frequência de batimento e velocidade radial':item.id==='WSR'?'Modelo meteorológico sintético existente':item.status==='Parcial'?'Protótipo incompleto':'Ainda não avaliada';
 detail.querySelector('[data-field="scope"]').textContent=item.id==='CW'?'O modelo demonstra a relação entre movimento radial e deslocamento Doppler. CW simples não determina distância; não é um radar pulsado.':item.id==='FMCW'?'O modelo didático usa uma rampa linear de frequência (chirp) e ilustra como a frequência de batimento se relaciona com distância e Doppler.':item.id==='WSR'?'Usa o motor meteorológico sintético já existente no KSBX: refletividade, velocidade e produtos derivados.':item.id==='Dual-Pol'?'Protótipo educativo: usa refletividade e CC sintético. ZDR e KDP ainda não estão implementados.':'Descrição conceitual; sem parâmetros operacionais ou capacidades de emprego real.';
 const activate=detail.querySelector('#tech-activate');
 activate.hidden=!['CW','FMCW','SFCW','UWB','PD','LPI','MTI','WSR','Dual-Pol'].includes(item.id);
 activate.textContent=item.id==='CW'?'Abrir demonstração CW':item.id==='FMCW'?'Abrir demonstração FMCW':item.id==='SFCW'?'Abrir simulação SFCW':item.id==='UWB'?'Abrir bancada UWB':item.id==='PD'?'Abrir bancada Pulse-Doppler':item.id==='LPI'?'Ver conceito LPI':item.id==='MTI'?'Abrir demonstração MTI':'Ativar no simulador';
 activate.onclick=()=>{

 SW:{n:'Largura do espectro',u:'m/s',a:0,b:30,d:1,k:'W',st:[[0,'#101018'],[3,'#5a5a60'],[5,'#9a9a9a'],[8,'#f09010'],[12,'#e02010'],[16,'#e010a0'],[20,'#a040f0'],[26,'#ffffff'],[30,'#e8f020']]},
 VIL:{n:'Líquido integrado (VIL)',u:'kg/m²',a:0,b:70,d:0,k:'VL',st:[[0,'#6f8a8c'],[5,'#18b8b8'],[15,'#2a6adf'],[25,'#1a1ac8'],[35,'#18b028'],[45,'#e0c820'],[55,'#e03018'],[65,'#d838b8'],[70,'#ffffff']]},
 ET:{n:'Topos de eco',u:'km',a:0,b:20,d:1,k:'ET',st:[[0,'#202830'],[3,'#0aa0c8'],[6,'#1060d0'],[9,'#2a1a90'],[11,'#18b868'],[13,'#10a010'],[15,'#e8d020'],[17,'#e08010'],[18,'#900000'],[20,'#ff3030']]}};
for(const k in P)P[k].l=mk(P[k].st,P[k].a,P[k].b);
/* ---------- desenho: cada pixel da tela consulta seu bin polar (resolução nativa, sem esticar bitmap) ---------- */
function draw(){
 const dpr=Math.min(devicePixelRatio||1,2),W=cv.width=Math.round(innerWidth*dpr),H=cv.height=Math.round(innerHeight*dpr),p=P[prod],col=p.k=='VL'||p.k=='ET';
 const S=col?cols(t):scan(tilt,t,dea||prod=='SRV'),data=S[p.k],mask=col?null:S.Z;cur={data,mask,p};
 const img=cx.createImageData(W,H),d=img.data,k=view.s*dpr,ce=Math.cos(tilt*D),mx=DR[0]*1000/60,my=DR[1]*1000/60,l=p.l,TP=2*Math.PI;
 for(let py=0;py<H;py++){const y=view.y-(py-H/2)/k;for(let px=0;px<W;px++){const x=view.x+(px-W/2)/k,r=Math.hypot(x,y);if(r>=RM)continue;
  let az=Math.atan2(x,y);if(az<0)az+=TP;const idx=((az/TP*NAZ)|0)*NG+((r/GT)|0);let v=data[idx];if(v!==v||(mask&&mask[idx]!==mask[idx]))continue;
  if(prod=='SRV')v-=(mx*x+my*y)/(r+1e-6)*ce;
  const n=(Math.max(0,Math.min(255,(v-p.a)/(p.b-p.a)*255))|0)*4,o=(py*W+px)*4;d[o]=l[n];d[o+1]=l[n+1];d[o+2]=l[n+2];d[o+3]=255}}
 cx.putImageData(img,0,0);
 const X=x=>(x-view.x)*k+W/2,Y=y=>H/2-(y-view.y)*k;
 cx.globalCompositeOperation='destination-over';cx.strokeStyle='#17212c';cx.lineWidth=1;cx.beginPath();
 for(let g=-300;g<=300;g+=25){cx.moveTo(X(g),0);cx.lineTo(X(g),H);cx.moveTo(0,Y(g));cx.lineTo(W,Y(g))}cx.stroke();
 cx.fillStyle='#050608';cx.fillRect(0,0,W,H);cx.globalCompositeOperation='source-over';
 cx.strokeStyle='#8fa2b855';cx.fillStyle='#8fa2b8';cx.font=11*dpr+'px sans-serif';
 for(let R=50;R<=200;R+=50){cx.beginPath();cx.arc(X(0),Y(0),R*k,0,TP);cx.stroke();cx.fillText(R+' km',X(0)+4*dpr,Y(0)-R*k-3*dpr)}
 cx.beginPath();cx.arc(X(0),Y(0),RM*k,0,TP);cx.stroke();
 const m=22*60+t,hh=String(m/60|0).padStart(2,'0'),mm=String(m%60).padStart(2,'0');
 $('il').innerHTML='<b>'+p.n+'</b><br>'+(col?'Coluna completa':'Elevação = '+tilt.toFixed(1)+'°');
 $('ir').innerHTML=hh+':'+mm+'Z<br>Dados sintéticos';cbar(p)}
function cbar(p){const w=cb.width=innerWidth,h=cb.height=24;for(let x=0;x<w;x++){const n=(x/w*255|0)*4;bx.fillStyle='rgb('+p.l[n]+','+p.l[n+1]+','+p.l[n+2]+')';bx.fillRect(x,0,1,h)}
 bx.font='11px sans-serif';bx.fillStyle='#fff';bx.strokeStyle='#000';bx.lineWidth=3;
 for(let i=0;i<=8;i++){const v=p.a+(p.b-p.a)*i/8,s=v.toFixed(p.d==2?2:p.d?1:0),x=Math.min(w-bx.measureText(s).width-3,Math.max(3,i/8*w-10));bx.strokeText(s,x,16);bx.fillText(s,x,16)}}
/* ---------- interface ---------- */
$('pb').innerHTML=Object.keys(P).map(k=>'<button data-p="'+k+'" title="'+P[k].n+'"'+(k==prod?' class="on"':'')+'>'+k+'</button>').join(' ');
$('tl').innerHTML=[.5,.9,1.3,1.8,2.4,3.1,4,5.1,6.4,8,10,12.5,15.6,19.5].map(e=>'<option value="'+e+'">'+e.toFixed(1)+'°</option>').join('');
$('pb').onclick=e=>{const b=e.target.closest('button');if(!b)return;prod=b.dataset.p;[...$('pb').children].forEach(x=>x.classList.toggle('on',x==b));draw()};
$('tl').onchange=e=>{tilt=+e.target.value;draw()};
$('sc').onchange=e=>{scen=e.target.value;build(scen);cache.clear();t=0;draw()};
$('pl').onclick=()=>{play=!play;$('pl').textContent=play?'⏸':'▶'};
$('cat').onclick=()=>{$('catalog').classList.toggle('open');if($('catalog').classList.contains('open'))renderCatalog()};
$('tech-search').oninput=renderCatalog;
$('da').onchange=e=>{dea=e.target.checked;draw()};
cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};
cv.onpointerup=()=>{drag=null;cv.style.cursor='grab'};
cv.onpointermove=e=>{if(drag){view.x-=(e.clientX-drag.x)/view.s;view.y+=(e.clientY-drag.y)/view.s;drag={x:e.clientX,y:e.clientY};draw();return}
 const x=view.x+(e.clientX-innerWidth/2)/view.s,y=view.y-(e.clientY-innerHeight/2)/view.s,r=Math.hypot(x,y),rd=$('rd');
 if(!cur||r>=RM){rd.hidden=true;return}let az=Math.atan2(x,y);if(az<0)az+=2*Math.PI;const i=((az/(2*Math.PI)*NAZ)|0)*NG+((r/GT)|0),v=cur.data[i];
 if(v!==v||(cur.mask&&cur.mask[i]!==cur.mask[i])){rd.hidden=true;return}
 rd.hidden=false;rd.textContent=v.toFixed(cur.p.d)+' '+cur.p.u+' · '+(az/D|0)+'° · '+r.toFixed(0)+' km'};
cv.onwheel=e=>{e.preventDefault();view.s=Math.max(.8,Math.min(16,view.s*Math.exp(-e.deltaY*.0015)));draw()};
addEventListener('resize',draw);
setInterval(()=>{if(play&&!drag){t=(t+2)%62;draw()}},900);
build(scen);draw();
})();
</script></body></html>
