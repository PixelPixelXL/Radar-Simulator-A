<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar sintético</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--pn:#111a26;--bd:#263648;--tx:#e5edf5;--mu:#8fa2b8;--ac:#58b8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px Inter,"Segoe UI",Arial,sans-serif;overflow:hidden}
#bar{position:absolute;top:0;left:0;right:0;z-index:2;background:var(--pn);border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#bar .t{margin-right:12px;line-height:1.25}#bar .t b{font-size:15px}#bar .t div{color:var(--mu);font-size:12px}
button,select{background:#172332;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font:inherit;min-height:34px;cursor:pointer}
button.on{background:#174a70;border-color:#327db2}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.ov{position:absolute;z-index:1;pointer-events:none;text-shadow:0 0 4px #000,0 0 2px #000}
#il{left:12px;bottom:34px}#il b{color:var(--ac);font-size:15px}#ir{right:12px;bottom:34px;text-align:right}
#cb{position:absolute;left:0;bottom:0;width:100%;height:24px;z-index:1}
#rd{position:absolute;z-index:2;right:12px;top:96px;background:#000b;border:1px solid var(--bd);padding:4px 8px;border-radius:6px;pointer-events:none}
label{color:var(--mu);display:flex;align-items:center;gap:6px}
#c2{position:absolute;inset:0;width:100%;height:100%;display:none}
#rdm{position:absolute;right:12px;bottom:84px;width:240px;height:160px;z-index:1;border:1px solid var(--bd);image-rendering:pixelated;background:#000;display:none}
</style></head><body>
<div id="bar"><div class="t"><b>KSBX Sandbox</b><div>VCP 212: modo precipitação</div></div>
<select id="rt" aria-label="Tipo de radar"><option value="wx">Meteorológico (WSR-88D)</option><option value="auto">Automotivo (SRR/MRR/LRR/4D)</option><option value="pcl">Passivo (PCL)</option><option value="dow">DOW — Doppler on Wheels (duplo Doppler)</option></select><span id="pb"></span><select id="tl" aria-label="Elevação"></select>
<select id="sc" aria-label="Cenário"><option value="line">Linha de instabilidade</option><option value="super">Supercélula</option><option value="strat">Chuva estratiforme</option></select>
<button id="pl" aria-label="Pausar ou tocar">⏸</button>
<label><input type="checkbox" id="da"> Desdobrar velocidade</label><span id="g2" style="display:none;gap:8px;align-items:center"><select id="ap" aria-label="Radar automotivo"><option value="srr">SRR 40 m</option><option value="mrr" selected>MRR 100 m</option><option value="lrr">LRR 250 m</option><option value="im4d">Imagem 4D 300 m</option></select><select id="nt" aria-label="Transmissores" style="display:none"><option value="1">1 transmissor</option><option value="2">2 transmissores</option><option value="3" selected>3 transmissores</option></select><label><input type="checkbox" id="gt"> Mostrar alvos reais</label></span></div>
<canvas id="c"></canvas><canvas id="c2"></canvas><canvas id="cb"></canvas>
<div class="ov" id="il"></div><div class="ov" id="ir"></div><div id="rd" hidden></div>
<script>
(()=>{'use strict';
const RM=230,NAZ=720,NG=460,GT=RM/NG,D=Math.PI/180,RE=8495,VN=26;
const DOW_R=60,DOW_NAZ=720,DOW_NG=800,DOW_GT=DOW_R/DOW_NG;
const DOW_POS=[{x:-30,y:-20,n:'DOW-6'},{x:35,y:15,n:'DOW-7'}];
const $=i=>document.getElementById(i),cv=$('c'),cx=cv.getContext('2d'),cb=$('cb'),bx=cb.getContext('2d');
let mode='wx';
let scen='line',prod='BR',tilt=0.5,t=0,play=true,dea=false,cur=null,drag=null;
const view={x:0,y:0,s:Math.min(innerWidth,innerHeight)/280};
/* ---------- ruído determinístico ---------- */
const hs=(i,j,k)=>{let n=Math.imul(i,374761393)^Math.imul(j,668265263)^Math.imul(k,1103515245);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295};
const vn=(x,y,k)=>{const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return(hs(i,j,k)*(1-u)+hs(i+1,j,k)*u)*(1-v)+(hs(i,j+1,k)*(1-u)+hs(i+1,j+1,k)*u)*v};
const fbm=(x,y)=>vn(x,y,1)*.5+vn(x*2.1,y*2.1,2)*.3+vn(x*4.3,y*4.3,3)*.2;
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let q=Math.imul(a^a>>>15,1|a);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296};
/* ---------- cenários: células (x,y km; s = escala km; z dBZ; top km; vo = saída de ar m/s) ---------- */
let C=[],DR=[0,0],MESO=null;
function build(s){const r=rng(s=='line'?7:s=='super'?3:5);C=[];MESO=null;
 const add=(x,y,sz,z,top,vo)=>C.push({x,y,s2:sz*sz,z,top,vo:vo||0});
 if(s=='line'){const a=35*D,ux=Math.sin(a),uy=Math.cos(a),nx=Math.cos(a),ny=-Math.sin(a);DR=[nx,ny];
  for(let k=-16;k<=16;k++){const al=k*6.5+(r()-.5)*3,ac=6-.0028*al*al+(r()-.5)*4;add(70+ux*al+nx*ac,15+uy*al+ny*ac,4+2*r(),50+8*r()-Math.abs(al)*.08,10+4*r(),13)}
  for(let k=-11;k<=11;k++){const al=k*9,ac=-26+(r()-.5)*8;add(70+ux*al+nx*ac,15+uy*al+ny*ac,11,29+5*r(),7,0)}
 }else if(s=='super'){DR=[.72,.54];
  add(55,28,7,62,15,12);add(78,46,16,44,11,0);add(28,40,10,35,9,0);add(120,-45,5,48,11,10);
  for(let k=0;k<9;k++){const a=(30+k*26)*D;add(52+4.6*Math.sin(a),17+4.6*Math.cos(a),2.2,57-1.2*k,12,4)}
  MESO={x:52,y:17,rc:1.4,vm:48};
 }else{DR=[.5,.35];const a=60*D,ux=Math.sin(a),uy=Math.cos(a);
  for(let k=-9;k<=9;k++)add(60+ux*k*18+(r()-.5)*6,10+uy*k*18+(r()-.5)*6,18,31+8*r(),8,0);
  for(let k=0;k<8;k++)add(30+r()*100,-30+r()*80,4,44+6*r(),10,6)}}
const frame=t=>C.map(c=>({x:c.x+DR[0]*t,y:c.y+DR[1]*t,s2:c.s2,z:c.z,top:c.top,vo:c.vo}));
/* refletividade em (x,y,z): perfil vertical + textura + banda brilhante */
function zdb(F,x,y,z){let L=0;
 for(const c of F){const dx=x-c.x,dy=y-c.y,d2=dx*dx+dy*dy;if(d2>6*c.s2)continue;const f=z/c.top;if(f>=1)continue;L+=Math.pow(10,(c.z-12*d2/c.s2-48*f*f)/10)}
 if(L<=0)return -99;let Z=10*Math.log10(L);
 Z+=(fbm(x/5-DR[0]*t/5,y/5-DR[1]*t/5)-.5)*(Z>40?18:10);
 const b=z-4.2;if(Z<42)Z+=4*Math.exp(-b*b/.12);return Z}
const env=z=>{const d=(150+110*Math.min(z,6)/6)*D,sp=8+(scen=='super'?30:22)*Math.min(z,8)/8;return[-sp*Math.sin(d),-sp*Math.cos(d)]};
function wnd(F,x,y,z){let[u,v]=env(z);
 for(const c of F){if(!c.vo)continue;const dx=x-c.x,dy=y-c.y,d2=dx*dx+dy*dy,s2=c.s2*2.5;if(d2>6*s2)continue;const w=c.vo*Math.exp(-d2/(2*s2)-z/2.5)/(Math.sqrt(d2)+.01);u+=dx*w;v+=dy*w}
 if(MESO){const dx=x-MESO.x-DR[0]*t,dy=y-MESO.y-DR[1]*t,d=Math.hypot(dx,dy)+.01,vt=MESO.vm*(d<MESO.rc?d/MESO.rc:MESO.rc/d)*Math.exp(-z*z/80);u+=-dy/d*vt;v+=dx/d*vt}
 return[u,v]}
/* ---------- varredura polar (geometria do feixe, atenuação, bloqueio, clutter, ruído) ---------- */
const cache=new Map();const keep=(k,v)=>{cache.set(k,v);if(cache.size>10)cache.delete(cache.keys().next().value);return v};
function scan(el,t,da,rx,ry,R,NA,NGa,GTa,xb){const key=[scen,el,t,da,rx,ry,R].join('|');if(cache.has(key))return cache.get(key);
 const N=NA*NGa,Z=new Float32Array(N).fill(NaN),V=new Float32Array(N),W=new Float32Array(N),Rr=new Float32Array(N),F=frame(t),se=Math.sin(el*D),ce=Math.cos(el*D);
 const rr=rng(11),blk=new Float32Array(NA).map((_,i)=>(hs(i,0,77)-.5)*3);
 for(let n=0;n<3;n++){const b=Math.floor(rr()*NA),w=2+Math.floor(rr()*3),a=6+rr()*8;for(let k=0;k<w;k++)blk[(b+k)%NA]-=a}
 const atk=xb?3:1;
 for(let i=0;i<NA;i++){const az=(i+.5)*360/NA*D,sa=Math.sin(az),ca=Math.cos(az);let at=0;
  for(let j=0;j<NGa;j++){const r=(j+.5)*GTa,g=r*ce,x=rx+g*sa,y=ry+g*ca,h=r*se+r*r/(2*RE)+.03,hw=r*.0083,k=i*NGa+j;if(h>17)break;
   let L=0;for(const q of[-.5,0,.5]){const zz=zdb(F,x,y,Math.max(h+q*hw,.03));if(zz>-90)L+=Math.pow(10,zz/10)}
   let z=L>0?10*Math.log10(L/3):-99;const zmin=-3+20*Math.log10(Math.max(r,1)/50);
   if(z>-90){const zc=z;z+=blk[i]*(r>25?1:.3)-at;at=Math.min(14,at+.02*atk*Math.max(0,zc-30)*GTa)}
   let cl=0;if(el<1.3&&r<26&&hs(i,j,9)<.5*(1-r/26)){cl=1;z=Math.max(z,10+16*hs(i,j,10))}
   if(z<zmin&&!cl)continue;
   Z[k]=z+(hs(i,j,3)-.5)*3;
   if(cl){V[k]=(hs(i,j,4)-.5)*1.2;W[k]=8+7*hs(i,j,5);Rr[k]=.45+.35*hs(i,j,6);continue}
   const snr=Math.exp(-(z-zmin)/6),[u,v]=wnd(F,x,y,Math.max(h,.03));
   let vr=(u*sa+v*ca)*ce+(hs(i,j,4)-.5)*(1.5+10*snr);if(!da)vr=((vr+VN)%(2*VN)+2*VN)%(2*VN)-VN;V[k]=vr;
   const md=MESO?Math.hypot(x-MESO.x-DR[0]*t,y-MESO.y-DR[1]*t):99;
   W[k]=2.2+.07*Math.max(0,z-15)+(hs(i,j,5)-.5)*2+8*snr+(MESO?14*Math.exp(-md*md/(2*MESO.rc*MESO.rc*4)):0);
   const b=h-4.2;let rho=.985+(hs(i,j,6)-.5)*.014-.07*Math.exp(-b*b/.3)*(z<45?1:.4)-(z>57?.07:0)-.3*snr;
   if(md<.9&&h<2.5){rho=.5+.2*hs(i,j,7);Z[k]=Math.max(Z[k],52)}
   Rr[k]=Math.max(.2,rho)}}
 return keep(key,{Z,V,W,R:Rr})}
/* varredura específica DOW */
const dowScan=(pos,el,t,da)=>scan(el,t,da,pos.x,pos.y,DOW_R,DOW_NAZ,DOW_NG,DOW_GT,true);
/* produtos de coluna: VIL e topo de eco (com cone de silêncio de 19,5°) */
function cols(t){const key='C'+scen+t;if(cache.has(key))return cache.get(key);
 const N=NAZ*NG,VL=new Float32Array(N).fill(NaN),ET=new Float32Array(N).fill(NaN),F=frame(t);
 for(let i=0;i<NAZ;i++){const az=(i+.5)*360/NAZ*D,sa=Math.sin(az),ca=Math.cos(az);
  for(let j=0;j<NG;j++){const g=(j+.5)*GT,x=g*sa,y=g*ca,k=i*NG+j;if(zdb(F,x,y,1)<5)continue;
   const zm=Math.min(16,g*.354);let vil=0,top=0;
   for(let z=.5;z<zm;z+=1){const Z=zdb(F,x,y,z);if(Z>18)top=z;if(Z>0)vil+=3.44e-6*Math.pow(10,Math.min(Z,56)/10*4/7)*1000}
   VL[k]=vil;if(top>0)ET[k]=top}}
 return keep(key,{VL,ET})}
/* ---------- tabelas de cores ---------- */
function mk(st,a,b){const o=new Uint8ClampedArray(1024),h=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
 for(let n=0;n<256;n++){const v=a+(b-a)*n/255;let p=0;while(p<st.length-2&&v>st[p+1][0])p++;
  const[v0,c0]=st[p],[v1,c1]=st[p+1],f=Math.max(0,Math.min(1,(v-v0)/(v1-v0))),A=h(c0),B=h(c1);
  for(let q=0;q<3;q++)o[n*4+q]=A[q]+(B[q]-A[q])*f;o[n*4+3]=255}return o}
const BVs=[[-40,'#7a0aa8'],[-30,'#2b3fd0'],[-22,'#27c4e0'],[-14,'#7de8a0'],[-6,'#10b020'],[-1,'#0f7a1c'],[0,'#707a70'],[1,'#7a1010'],[6,'#d01010'],[14,'#ff5a5a'],[22,'#ff9ab0'],[30,'#ff9a40'],[40,'#a04a10']];
const P={
 BR:{n:'Refletividade',u:'dBZ',a:-10,b:75,d:0,k:'Z',st:[[-10,'#0b1020'],[0,'#3a5a88'],[10,'#4a90b8'],[18,'#3cb44b'],[25,'#1e8c2a'],[30,'#e6e02a'],[35,'#f0c010'],[40,'#f08a10'],[45,'#e03010'],[50,'#b00a0a'],[55,'#d83a8c'],[60,'#b04ad0'],[65,'#78e8f0'],[75,'#ffffff']]},
 BV:{n:'Velocidade radial',u:'m/s',a:-40,b:40,d:1,k:'V',st:BVs},
 SRV:{n:'Velocidade relativa à tempestade',u:'m/s',a:-30,b:30,d:1,k:'V',st:BVs},
 CC:{n:'Coeficiente de correlação',u:'',a:.2,b:1.05,d:2,k:'R',st:[[.2,'#2a0a3a'],[.6,'#8a8a96'],[.75,'#4a4acf'],[.85,'#1fb4c0'],[.9,'#35c24a'],[.94,'#e8d83a'],[.97,'#f07a1a'],[.99,'#e01818'],[1.02,'#ff6aa8'],[1.05,'#ffd0e6']]},
 SW:{n:'Largura do espectro',u:'m/s',a:0,b:30,d:1,k:'W',st:[[0,'#101018'],[3,'#5a5a60'],[5,'#9a9a9a'],[8,'#f09010'],[12,'#e02010'],[16,'#e010a0'],[20,'#a040f0'],[26,'#ffffff'],[30,'#e8f020']]},
 VIL:{n:'Líquido integrado (VIL)',u:'kg/m²',a:0,b:70,d:0,k:'VL',st:[[0,'#6f8a8c'],[5,'#18b8b8'],[15,'#2a6adf'],[25,'#1a1ac8'],[35,'#18b028'],[45,'#e0c820'],[55,'#e03018'],[65,'#d838b8'],[70,'#ffffff']]},
 ET:{n:'Topos de eco',u:'km',a:0,b:20,d:1,k:'ET',st:[[0,'#202830'],[3,'#0aa0c8'],[6,'#1060d0'],[9,'#2a1a90'],[11,'#18b868'],[13,'#10a010'],[15,'#e8d020'],[17,'#e08010'],[18,'#900000'],[20,'#ff3030']]}};
for(const k in P)P[k].l=mk(P[k].st,P[k].a,P[k].b);
/* ---------- desenho: cada pixel da tela consulta seu bin polar (resolução nativa, sem esticar bitmap) ---------- */
function draw(){
 const dpr=Math.min(devicePixelRatio||1,2),W=cv.width=Math.round(innerWidth*dpr),H=cv.height=Math.round(innerHeight*dpr),p=P[prod],col=p.k=='VL'||p.k=='ET';
 const S=col?cols(t):scan(tilt,t,dea||prod=='SRV',0,0,RM,NAZ,NG,GT,false),data=S[p.k],mask=col?null:S.Z;cur={data,mask,p};
 const img=cx.createImageData(W,H),d=img.data,k=view.s*dpr,ce=Math.cos(tilt*D),mx=DR[0]*1000/60,my=DR[1]*1000/60,l=p.l,TP=2*Math.PI;
 for(let py=0;py<H;py++){const y=view.y-(py-H/2)/k;for(let px=0;px<W;px++){const x=view.x+(px-W/2)/k,r=Math.hypot(x,y);if(r>=RM)continue;
  let az=Math.atan2(x,y);if(az<0)az+=TP;const idx=((az/TP*NAZ)|0)*NG+((r/GT)|0);let v=data[idx];if(v!==v||(mask&&mask[idx]!==mask[idx]))continue;
  if(prod=='SRV')v-=(mx*x+my*y)/(r+1e-6)*ce;
  const n=(Math.max(0,Math.min(255,(v-p.a)/(p.b-p.a)*255))|0)*4,o=(py*W+px)*4;d[o]=l[n];d[o+1]=l[n+1];d[o+2]=l[n+2];d[o+3]=255}}
 cx.putImageData(img,0,0);
 const X=x=>(x-view.x)*k+W/2,Y=y=>H/2-(y-view.y)*k;
 cx.globalCompositeOperation='destination-over';cx.strokeStyle='#17212c';cx.lineWidth=1;cx.beginPath();
 for(let g=-300;g<=300;g+=25){cx.moveTo(X(g),0);cx.lineTo(X(g),H);cx.moveTo(0,Y(g));cx.lineTo(W,Y(g))}cx.stroke();
 cx.fillStyle='#050608';cx.fillRect(0,0,W,H);cx.globalCompositeOperation='source-over';
 cx.strokeStyle='#8fa2b855';cx.fillStyle='#8fa2b8';cx.font=11*dpr+'px sans-serif';
 for(let R=50;R<=200;R+=50){cx.beginPath();cx.arc(X(0),Y(0),R*k,0,TP);cx.stroke();cx.fillText(R+' km',X(0)+4*dpr,Y(0)-R*k-3*dpr)}
 cx.beginPath();cx.arc(X(0),Y(0),RM*k,0,TP);cx.stroke();
 const m=22*60+t,hh=String(m/60|0).padStart(2,'0'),mm=String(m%60).padStart(2,'0');
 $('il').innerHTML='<b>'+p.n+'</b><br>'+(col?'Coluna completa':'Elevação = '+tilt.toFixed(1)+'°');
 $('ir').innerHTML=hh+':'+mm+'Z<br>Dados sintéticos';cbar(p)}
function cbar(p){const w=cb.width=innerWidth,h=cb.height=24;for(let x=0;x<w;x++){const n=(x/w*255|0)*4;bx.fillStyle='rgb('+p.l[n]+','+p.l[n+1]+','+p.l[n+2]+')';bx.fillRect(x,0,1,h)}
 bx.font='11px sans-serif';bx.fillStyle='#fff';bx.strokeStyle='#000';bx.lineWidth=3;
 for(let i=0;i<=8;i++){const v=p.a+(p.b-p.a)*i/8,s=v.toFixed(p.d==2?2:p.d?1:0),x=Math.min(w-bx.measureText(s).width-3,Math.max(3,i/8*w-10));bx.strokeText(s,x,16);bx.fillText(s,x,16)}}
/* ---------- interface ---------- */
$('pb').innerHTML=Object.keys(P).map(k=>'<button data-p="'+k+'" title="'+P[k].n+'"'+(k==prod?' class="on"':'')+'>'+k+'</button>').join(' ');
$('tl').innerHTML=[.5,.9,1.3,1.8,2.4,3.1,4,5.1,6.4,8,10,12.5,15.6,19.5].map(e=>'<option value="'+e+'">'+e.toFixed(1)+'°</option>').join('');
$('pb').onclick=e=>{const b=e.target.closest('button');if(!b)return;prod=b.dataset.p;[...$('pb').children].forEach(x=>x.classList.toggle('on',x==b));mode=='dow'?dowDraw():draw()};
$('tl').onchange=e=>{tilt=+e.target.value;mode=='dow'?dowDraw():draw()};
$('sc').onchange=e=>{scen=e.target.value;build(scen);cache.clear();t=0;mode=='dow'?dowDraw():draw()};
$('pl').onclick=()=>{play=!play;$('pl').textContent=play?'⏸':'▶'};
$('da').onchange=e=>{dea=e.target.checked;mode=='dow'?dowDraw():draw()};
cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};
cv.onpointerup=()=>{drag=null;cv.style.cursor='grab'};
cv.onpointermove=e=>{if(drag){view.x-=(e.clientX-drag.x)/view.s;view.y+=(e.clientY-drag.y)/view.s;drag={x:e.clientX,y:e.clientY};draw();return}
 const x=view.x+(e.clientX-innerWidth/2)/view.s,y=view.y-(e.clientY-innerHeight/2)/view.s,r=Math.hypot(x,y),rd=$('rd');
 if(!cur||r>=RM){rd.hidden=true;return}let az=Math.atan2(x,y);if(az<0)az+=2*Math.PI;const i=((az/(2*Math.PI)*NAZ)|0)*NG+((r/GT)|0),v=cur.data[i];
 if(v!==v||(cur.mask&&cur.mask[i]!==cur.mask[i])){rd.hidden=true;return}
 rd.hidden=false;rd.textContent=v.toFixed(cur.p.d)+' '+cur.p.u+' · '+(az/D|0)+'° · '+r.toFixed(0)+' km'};
cv.onwheel=e=>{e.preventDefault();view.s=Math.max(.8,Math.min(16,view.s*Math.exp(-e.deltaY*.0015)));draw()};
addEventListener('resize',()=>{if(mode=='wx')draw();else if(mode=='dow')dowDraw();else fit2()});
/* ===== DOW dual-Doppler ===== */
function dowDraw(){
  const dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.max(1, Math.floor(innerWidth/2));
  const h=innerHeight;
  
  cv.style.left='0'; cv.style.right='auto'; cv.style.width='50%';
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  
  c2.style.left='50%'; c2.style.right='auto'; c2.style.width='50%';
  c2.width=Math.round(w*dpr); c2.height=Math.round(h*dpr); c2.style.display='block';

  // Pega as varreduras dos dois radares
  const sc0 = dowScan(DOW_POS[0], tilt, t, dea); 
  const sc1 = dowScan(DOW_POS[1], tilt, t, dea); 
  
  // Configuração dos painéis: 0 = Refletividade, 1 = Velocidade Radial
  const prods = [{k:'Z', p:P.BR, lo:P.BR.a, hi:P.BR.b}, {k:'V', p:P.BV, lo:P.BV.a, hi:P.BV.b}];
  const scans = [sc0, sc1];
  const ctxs = [cx, x2];
  const TP = 2 * Math.PI;

  for(let q=0; q<2; q++){
    const ctx = ctxs[q];
    const scanData = scans[q];
    const prod = prods[q];
    const data = scanData[prod.k];
    const pos = DOW_POS[q];
    
    const img = ctx.createImageData(cv.width, cv.height);
    const d = img.data;
    const k = Math.min(cv.width, cv.height) * 0.46 / DOW_R;

    // Renderiza o radar
    for(let py=0; py<cv.height; py++){
      const y = (cv.height/2 - py) / k;
      for(let px=0; px<cv.width; px++){
        const x = (px - cv.width/2) / k;
        const r = Math.hypot(x, y);
        if(r >= DOW_R) continue;
        
        let az = Math.atan2(x, y);
        if(az < 0) az += TP;
        
        const idx = ((az/TP * DOW_NAZ)|0) * DOW_NG + ((r/DOW_GT)|0);
        let v = data[idx];
        if(v !== v) continue;
        
        const n = (Math.max(0, Math.min(255, (v - prod.lo) / (prod.hi - prod.lo) * 255))|0) * 4;
        const o = (py * cv.width + px) * 4;
        d[o] = prod.p.l[n]; d[o+1] = prod.p.l[n+1]; d[o+2] = prod.p.l[n+2]; d[o+3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);

    // Grid e textos
    ctx.strokeStyle = '#8fa2b855'; ctx.fillStyle = '#8fa2b8';
    ctx.lineWidth = dpr; ctx.font = 11*dpr + 'px sans-serif';
    for(let r=20; r<=DOW_R; r+=20){
      ctx.beginPath(); ctx.arc(cv.width/2, cv.height/2, r*k, 0, TP); ctx.stroke();
      ctx.fillText(r+' km', cv.width/2 + 4*dpr, cv.height/2 - r*k - 3*dpr);
    }
    
    // Desenha o caminhão
    const cxp = cv.width/2, cyp = cv.height/2;
    ctx.fillStyle = '#58b8ff'; ctx.fillRect(cxp-10*dpr, cyp-4*dpr, 20*dpr, 8*dpr);
    ctx.fillStyle = '#2a3a50'; ctx.fillRect(cxp-4*dpr, cyp-10*dpr, 8*dpr, 5*dpr);
    
    // --- INÍCIO DA MATEMÁTICA DO DUAL-DOPPLER ---
    // Só desenha as setas de vento no painel esquerdo (q==0) para não poluir
    if(q === 0) {
      ctx.strokeStyle = '#ffffff'; 
      ctx.fillStyle = '#ffffff';
      
      // Varre uma grade de 8x8 km na área de sobreposição
      for(let wx = -40; wx <= 40; wx += 8) {
        for(let wy = -40; wy <= 40; wy += 8) {
          
          // Posição do alvo em relação ao DOW-6 e ao DOW-7
          const dx0 = wx - DOW_POS[0].x, dy0 = wy - DOW_POS[0].y;
          const dx1 = wx - DOW_POS[1].x, dy1 = wy - DOW_POS[1].y;
          
          const r0 = Math.hypot(dx0, dy0), r1 = Math.hypot(dx1, dy1);
          
          // Se estiver longe demais ou muito perto de algum radar, ignora
          if(r0 > DOW_R || r1 > DOW_R || r0 < 5 || r1 < 5) continue;
          
          // Pega os ângulos (azimutes) de cada radar até o alvo
          const az0 = Math.atan2(dx0, dy0), az1 = Math.atan2(dx1, dy1);
          
          // Calcula os índices do array para pegar a velocidade radial de cada um
          const idx0 = (((az0 < 0 ? az0 + TP : az0)/TP * DOW_NAZ)|0) * DOW_NG + ((r0/DOW_GT)|0);
          const idx1 = (((az1 < 0 ? az1 + TP : az1)/TP * DOW_NAZ)|0) * DOW_NG + ((r1/DOW_GT)|0);
          
          const v0 = sc0.V[idx0], v1 = sc1.V[idx1];
          
          // Se algum dos dois estiver cego (NaN) ou nulo, não tem como calcular
          if(v0 !== v0 || v1 !== v1) continue;

          // Geometria do vento: u = Leste-Oeste, v = Norte-Sul
          // Equação: Vradial = u * sin(az) + v * cos(az)
          // Resolvemos o sistema linear 2x2
          const s0 = Math.sin(az0), c0 = Math.cos(az0);
          const s1 = Math.sin(az1), c1 = Math.cos(az1);
          const det = s0 * c1 - s1 * c0;

          // Se o ângulo entre os radares for quase 0 (feixes alinhados), a matemática quebra
          if(Math.abs(det) < 0.1) continue;

          const u = (v0 * c1 - v1 * c0) / det;
          const v = (s0 * v1 - s1 * v0) / det;

          // Converte a posição real (km) para a tela (pixels)
          const px0 = (wx - pos.x) * k + cv.width/2;
          const py0 = cv.height/2 - (wy - pos.y) * k;
          
          // Desenha a setinha do vento
          const len = 12 * dpr;
          const endX = px0 + (u / 20) * len; // Escala a seta
          const endY = py0 - (v / 20) * len;
          
          if (!isNaN(endX) && !isNaN(endY)) {
            ctx.beginPath();
            ctx.moveTo(px0, py0);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            
            // Pontinha da seta
            ctx.beginPath();
            ctx.arc(endX, endY, 2*dpr, 0, TP);
            ctx.fill();
          }
        }
      }
    }
    // --- FIM DA MATEMÁTICA DO DUAL-DOPPLER ---

    ctx.fillStyle = '#e5edf5'; ctx.font = 'bold ' + (14*dpr) + 'px sans-serif';
    ctx.fillText(pos.n + ' · ' + (q===0 ? 'Refletividade + Vetor de Vento 2D' : 'Velocidade Radial (m/s)'), 12*dpr, 28*dpr);
    ctx.fillStyle = '#8fa2b8'; ctx.font = 11*dpr + 'px sans-serif';
    ctx.fillText('DOW · PPI sintético · ' + tilt.toFixed(2) + '°', 12*dpr, 45*dpr);
  }

  $('il').innerHTML = '<b>DOW — Dual-Doppler Real</b><br>Setas brancas: vento 2D recuperado (u, v)';
  $('ir').innerHTML = 'Modelo sintético<br>Geometria de dois radares';
  $('cb').style.display = 'none'; $('rd').hidden = true;
}
